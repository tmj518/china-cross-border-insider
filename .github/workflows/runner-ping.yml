# A probe: can this repository start a job at all, on either runner image?
# Two jobs, one step each, no checkout, no secrets. If both fail with zero steps the
# problem is the account or the platform, not the repository's workflows.
name: Runner ping

on:
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu-latest started"
  pin22:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "ubuntu-22.04 started"