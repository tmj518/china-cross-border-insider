# The C line: guides for people moving to, working in or visiting China.
#
# Deliberately a separate file from daily.yml. The trade pipeline's cron, steps and gates are not
# referenced here and are not modified by it; this workflow can fail every day for a month without
# touching the A or B route.
#
# What it shares with the trade line is the repository and therefore one `astro build`. That is the
# only shared failure mode, and tools/c-line-orchestrator.mjs handles it the only way that works:
# the guide is written, the site is built, and on failure the guide is removed before this workflow
# can commit it. A bad guide never reaches main.
name: C line

on:
  schedule:
    # 15:20 Beijing (07:20 UTC). Clear of the trade crons at 23:20, 01:20, 12:20 and 13:20 UTC so the
    # two workflows never contend for the same runner minute.
    - cron: '20 7 * * *'
    - cron: '50 8 * * *'   # 16:50 Beijing - guide BACKUP
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c-line
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      #
      # The endpoint is a secret, the model name is an endpoint id, and both are the same two names the
      # trade line already uses. Nothing new to configure.
      #
      #
      # The plan, before the writing.
      #
      # tools/plan-guides.mjs scores every queued topic against Search Console - measured demand where
      # there is any, a stated prior where there is not, multiplied by intent and by how well we already
      # cover it - and writes the score onto the topic. The orchestrator then sorts by it, so the queue
      # becomes a plan rather than a pile in the order somebody had an idea.
      #
      # It also prints the scorecard: what each published guide is actually earning. That half is the
      # point. On 2026-10-26 it reported ten guides, zero impressions, zero article-level inbound links,
      # which says the bottleneck is links rather than subjects - and no amount of planning fixes that.
      #
      # continue-on-error: a refused Search Console read must not stop the day's guide. It falls back to
      # priors and says so.
      #
      - name: Plan the queue from data
        if: always()
        continue-on-error: true
        env:
          GSC_CREDENTIALS_BASE64: ${{ secrets.GSC_CREDENTIALS_BASE64 }}
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS_BASE64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:landedmath.com' }}
        run: node tools/plan-guides.mjs

      - name: Write one guide
        id: run
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY || secrets.DUBAO201628 }}
          ARK_MODEL_WRITER: ${{ vars.ARK_MODEL_WRITER }}
          #
          # The second vendor, which was not passed here before.
          #
          # On 2026-10-27 every call in this step failed with "ETIMEDOUT: fetch failed" in seventeen
          # seconds - six calls, three topics, immediate connection failures rather than slow models.
          # lib-llm.mjs is written to switch provider on exactly that error, and it could not: the
          # writer's only reachable provider was the one that was unreachable, because this step passed
          # no DeepSeek key at all. The fallback looked, found nothing, and reported the original error.
          #
          # Same names the trade line already passes. Nothing new to configure, and no change to the
          # shared library - the A line keeps its own snapshot of this behaviour.
          #
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_WRITE_API_KEY: ${{ secrets.DEEPSEEK_WRITE_API_KEY }}
          OWNER_KEY_2: ${{ secrets.GITHUB66CHINA }}
        run: node tools/c-line-orchestrator.mjs

      #
      # The health read, which is the one thing a per-run card cannot do.
      #
      # A card describes a run. A streak describes a condition: the trade line ending DUPLICATE-SUBJECT
      # twice is not two coincidences, it is research proposing covered ground, and the fix for that is
      # neither in the trade pipeline nor in this one. Same for the provider: every failure recovered by
      # the fallback means the configured two-vendor arrangement is not the one in force, and the card
      # that says "volces writes, deepseek reviews" is describing a plan rather than a fact.
      #
      # It writes data/health.json and prints a sentence. It changes nothing - a monitor that acts is a
      # monitor that can be wrong in a way nobody sees.
      #
      - name: Read the running health
        if: always()
        continue-on-error: true
        run: node tools/run-health.mjs

      #
      # Remove the date-suffixed near-duplicates the trade line leaves behind. It reports by default and
      # deletes only when the title is byte-identical to the surviving file, so a real article whose slug
      # happens to carry a date is never touched.
      #
      - name: Remove date-suffixed duplicates
        if: always()
        run: node tools/cleanup-duplicates.mjs --apply

      #
      # Commit only if something actually changed. The orchestrator already removed any guide whose build
      # failed, so what is on disk here has been verified against a real build.
      #
      - name: Commit the guide
        if: always()
        run: |
          if [ -z "$(git status --porcelain src/content data/guide-queue.json data/runs)" ]; then
            echo "nothing to commit - no guide was published and no duplicate was found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          #
          # Add each path only if it exists.
          #
          # `git add` treats a pathspec that matches nothing as fatal, and it fails the whole step - so a
          # run that had just written and approved a guide died here because data/metrics/ is created
          # later in the run by the notifier. The article was on disk and not on the site until the next
          # day's run picked it up. That is the third time this exact shape has cost a publication
          # (cleanup.log on 2026-10-22, gaps_*.json on 2026-10-26, this on 2026-10-27), so the rule now
          # is: never hand git a path that a previous step might not have created.
          #
          git add -A src/content data/runs 2>/dev/null || true
          for p in data/guide-queue.json data/guide-plan.json data/health.json data/cleanup.log; do
            [ -e "$p" ] && git add "$p" || true
          done
          [ -d data/metrics ] && git add data/metrics || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "c-line: $(date -u +%F) guide run"
          git pull --rebase --autostash origin main || true
          git push

      #
      # The operator's ledger. tools/feishu-run-ledger.mjs reads data/runs and writes one row per run
      # with 路线 = c, into the same 运行台账 table the trade line writes to. No new table, no schema
      # change - the route column is what tells them apart.
      #
      - name: Record the run in the Feishu ledger
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
        run: node tools/feishu-run-ledger.mjs --limit=5

      #
      # The corpus, measured rather than described. Every published piece in one row: figures, internal
      # links in and out, and whether a title or a target keyword collides with another piece.
      #
      # It reconciles the whole corpus each run, not just today's article, so an article the trade line
      # published at 07:20 is picked up here at 15:20 and one published at 20:20 is picked up tomorrow.
      # --with-gates runs qa-check per analysis; that is the only slow part and it is worth the minute.
      #
      - name: Record what is published in the content ledger
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
        run: node tools/content-ledger.mjs --with-gates --prune

      - name: Report the verdict
        if: always()
        run: |
          V=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('data/runs/latest-c.json','utf8')).verdict)}catch{console.log('NO-RECORD')}")
          echo "verdict: $V"
          echo "### C line: $V" >> "$GITHUB_STEP_SUMMARY"
          node -e "try{const r=JSON.parse(require('fs').readFileSync('data/runs/latest-c.json','utf8'));console.log('| field | value |\n| --- | --- |\n| verdict | '+r.verdict+' |\n| article | '+(r.article||'-')+' |\n| seconds | '+r.seconds+' |\n| cost | \$'+Number(r.usage?.usd||0).toFixed(4)+' |\n| reason | '+((r.reasons||[]).join('; ')||'-')+' |')}catch{}" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in
            PUBLISHED|NO-SUBJECT|DRY-RUN|NO-KEYS) exit 0 ;;
            *) exit 1 ;;
          esac

      #
      # The card, through the one channel that does not need the app token.
      #
      # The Feishu ledger writes through the open API, which answers 21001 when the app is restricted;
      # the webhook is a different mechanism and keeps working. For three months of no supervision this
      # is the difference between "quiet because nothing happened" and "quiet because nobody can see".
      #
      - name: Tell the phone
        if: always()
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ROUTE: c
        run: |
          mkdir -p data/tmp
          node -e "const fs=require('fs');try{fs.writeFileSync('data/tmp/orchestrator-report.json',fs.readFileSync('data/runs/latest-c.json'))}catch{fs.writeFileSync('data/tmp/orchestrator-report.json','{\"verdict\":\"NO-RECORD\",\"reasons\":[\"the run wrote no record\"]}')}"
          node tools/notify-feishu.mjs
