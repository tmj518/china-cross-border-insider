# A read-only SEO audit: which pages does Google already rank, and which of them nobody clicks.
#
# It runs in the runner because the Search Console key is a repository secret. It writes nothing and publishes nothing.
name: SEO audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Which pages are ranked but not clicked
        env:
          GSC_CREDENTIALS_BASE64: ${{ secrets.GSC_CREDENTIALS_BASE64 }}
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS_BASE64 }}
          GSC_SITE: sc-domain:landedmath.com
          GSC_SITE_URL: sc-domain:landedmath.com
        run: node tools/optimize-titles.mjs --min-imp=20 --max-pos=12 --max-ctr=0.02